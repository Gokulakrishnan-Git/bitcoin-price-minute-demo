name: Bitcoin price every minute

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bitcoin-price-sampler
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sample five one-minute prices
        run: python scripts/sample_price.py
        env:
          SAMPLES: "5"
          INTERVAL_SECONDS: "60"

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/prices.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update Bitcoin price samples"
            git push
          fi
